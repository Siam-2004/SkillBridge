{% load static %}
<header class="site-header">
  <div class="shell site-header__inner">
    <a class="brand" href="{% url 'home' %}">
      <span class="brand__mark" aria-hidden="true">S</span>
      <span class="brand__text">SKILLBRIDGE</span>
    </a>

    <button class="nav-toggle" type="button" data-nav-toggle aria-controls="site-nav" aria-expanded="false" aria-label="Toggle navigation">
      ☰
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Main">
      <a href="{% url 'home' %}"{% if request.path == '/' %} class="is-active"{% endif %}>Home</a>
      <a href="{% url 'directory:freelancer_list' %}"{% if nav_section == 'freelancers' %} class="is-active"{% endif %}>Freelancers</a>
      <a href="{% url 'marketplace:job_list' %}"{% if nav_section == 'jobs' %} class="is-active"{% endif %}>Jobs</a>
    </nav>

    <div class="header-actions">

      <button class="theme-switch" type="button" data-theme-toggle title="Switch Theme (Light / Dark)" aria-label="Toggle theme">
        <span class="theme-switch__track">
          <span class="theme-switch__icon theme-switch__icon--sun" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </span>
          <span class="theme-switch__icon theme-switch__icon--moon" aria-hidden="true">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </span>
          <span class="theme-switch__thumb"></span>
        </span>
      </button>

      {% if user.is_authenticated %}
        <a class="nav-notif-btn" href="{% url 'notifications:list' %}" title="Notifications" aria-label="Notifications" style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;color:var(--text-muted);text-decoration:none;transition:all 0.2s ease;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
          </svg>
          {% if unread_notifications %}
            <span style="position:absolute;top:0;right:0;background:#ef4444;color:#fff;font-size:0.68rem;font-weight:800;border-radius:10px;padding:1px 5px;line-height:1;box-shadow:0 0 6px rgba(239,68,68,0.6)">{{ unread_notifications }}</span>
          {% endif %}
        </a>
        <a class="btn btn--secondary btn--sm" href="{{ user.dashboard_url }}">Dashboard</a>
        <form method="post" action="{% url 'accounts:logout' %}" style="display:inline;margin:0">
          {% csrf_token %}
          <button type="submit" class="btn btn--logout btn--sm">Logout</button>
        </form>
        <a class="avatar avatar--sm" href="{% url 'accounts:settings' %}" title="{{ user.full_name }}">
          {% if user.avatar %}<img src="{{ user.avatar.url }}" alt="">{% else %}{{ user.initials|default:"U" }}{% endif %}
        </a>
      {% else %}
        <a class="nav-login-btn" href="{% url 'accounts:login' %}">Login</a>
        <a class="btn btn--primary btn--sm btn--signup" href="{% url 'accounts:register' %}">Sign Up</a>
      {% endif %}
    </div>
  </div>
</header>

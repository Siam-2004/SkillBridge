<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    {% for crumb in crumbs %}
      {% if not forloop.first %}<li class="sep" aria-hidden="true">/</li>{% endif %}
      <li>
        {% if crumb.url and not forloop.last %}<a href="{{ crumb.url }}">{{ crumb.label }}</a>
        {% else %}<span aria-current="page">{{ crumb.label }}</span>{% endif %}
      </li>
    {% endfor %}
  </ol>
</nav>

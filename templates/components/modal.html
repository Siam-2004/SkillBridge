<dialog class="modal" id="{{ id }}">
  <div class="modal__head"><h2>{{ title }}</h2></div>
  <div class="modal__body">{% block modal_body %}{{ body }}{% endblock %}</div>
  <div class="modal__foot">
    {% block modal_actions %}
      <button class="btn btn--ghost" type="button" data-modal-close>Close</button>
    {% endblock %}
  </div>
</dialog>

<div class="empty">
  <div class="empty__icon" aria-hidden="true">{{ icon|default:"◇" }}</div>
  <h3>{{ title|default:"Nothing here yet" }}</h3>
  {% if body %}<p>{{ body }}</p>{% endif %}
  {% if action_url %}<a class="btn btn--primary" href="{{ action_url }}">{{ action_label|default:"Get started" }}</a>{% endif %}
</div>

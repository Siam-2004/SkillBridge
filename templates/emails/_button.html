{% comment %}A bulletproof-ish email button. `url` and `label` come from context.{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:22px 0 4px;">
  <tr>
    <td style="border-radius:8px;background:{{ tone|default:'#4f46e5' }};">
      <a href="{{ url }}"
         style="display:inline-block;padding:11px 22px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:8px;">
        {{ label }}
      </a>
    </td>
  </tr>
</table>
<p style="margin:10px 0 0;font-size:11px;color:#94a3b8;word-break:break-all;">
  If the button does not work, paste this into your browser:<br>{{ url }}
</p>
